<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Focus Buddy</title>

<style>
body { font-family:Arial; text-align:center; background:#0b132b; color:#e0e7ff; }
.light { background:#f1f5f9; color:#000; }

.box {
  background:#1c2541;
  margin:10px;
  padding:15px;
  border-radius:10px;
  display:inline-block;
  width:280px;
}
.light .box { background:#e2e8f0; }

button { padding:8px; margin:5px; border-radius:8px; border:none; cursor:pointer; }
input, select { padding:8px; margin:5px; width:80%; }

.timer { font-size:50px; }

.progress-bar { width:100%; height:10px; background:#333; }
.progress-fill { height:100%; background:green; width:0%; }

.hidden { display:none; }

#chatBox { height:180px; overflow-y:auto; text-align:left; }

.user { background:#38bdf8; color:black; margin:5px; padding:5px; border-radius:5px; }
.bot { background:#334155; margin:5px; padding:5px; border-radius:5px; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox" class="box">
<h2>🔐 Login</h2>
<input id="name" placeholder="Name"><br>
<input id="email" placeholder="Email"><br>
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<h1>🌿 Focus Buddy</h1>

<button onclick="toggleMode()">🌗 Mode</button>
<button onclick="logout()">Logout</button>

<div class="box">
<h3>🎉 FREE FOR ALL</h3>
<p>Students & Teachers ke liye 💙</p>
</div>

<div class="box bot" id="botMessage"></div>

<!-- CLASS SELECT -->
<div class="box">
<h3>🎓 Select Class</h3>
<select id="classSelect">
<option value="">Select</option>
<option value="1-5">1–5</option>
<option value="6-8">6–8</option>
<option value="9-10">9–10</option>
<option value="11-12">11–12</option>
</select>
</div>

<!-- MOOD -->
<div class="box">
<h3>💭 Mood</h3>
<button onclick="setMood('🙂')">🙂</button>
<button onclick="setMood('😓')">😓</button>
<button onclick="setMood('😴')">😴</button>
</div>

<!-- TIMER -->
<div class="timer" id="timer">25:00</div>
<button onclick="startTimer()">Start</button>
<button onclick="pauseTimer()">Pause</button>
<button onclick="resetTimer()">Reset</button>

<!-- GOAL -->
<div class="box">
<h3>🎯 Goal</h3>
<input id="goal" placeholder="Hours">
<button onclick="setGoal()">Set</button>
<p id="goalDisplay"></p>
</div>

<!-- PROGRESS -->
<div class="box">
<h3>📊 Progress</h3>
<p id="progress">0 min</p>
<div class="progress-bar"><div id="bar" class="progress-fill"></div></div>
</div>

<!-- CHAT -->
<div class="box">
<h3>🤖 Chat</h3>
<div id="chatBox"></div>
<input id="userInput" placeholder="Type...">
<button onclick="sendMessage()">Send</button>
</div>

<!-- QUIZ -->
<div class="box">
<h3>🧠 Quiz</h3>
<button onclick="generateQuiz()">Generate Quiz</button>
<div id="quizBox"></div>
<button onclick="checkQuiz()">Submit</button>
<p id="quizResult"></p>
</div>

</div>

<script>
// LOGIN
function login(){
let n=name.value,e=email.value;
if(!n||!e) return alert("Fill all");
localStorage.setItem("userName",n);
showApp();
}
function logout(){ localStorage.clear(); location.reload(); }

function showApp(){
loginBox.classList.add("hidden");
app.classList.remove("hidden");
botMessage.innerText="👋 Hello "+localStorage.getItem("userName")+"!";
}

// MODE
function toggleMode(){ document.body.classList.toggle("light"); }

// TIMER
let t=1500,run=false,studied=0,goal=0,timer;

function updateDisplay(){
let m=Math.floor(t/60),s=t%60;
timerEl.innerText=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
let timerEl=document.getElementById("timer");

function startTimer(){
if(run)return;
run=true;
timer=setInterval(()=>{
if(t>0){
t--;studied++;
progress.innerText=studied+" min";
updateBar();updateDisplay();
}else{alert("Done");clearInterval(timer);run=false;}
},1000);
}
function pauseTimer(){clearInterval(timer);run=false;}
function resetTimer(){clearInterval(timer);run=false;t=1500;updateDisplay();}

function setGoal(){
goal=goalInput.value;
goalDisplay.innerText="Goal: "+goal+"h";
}
let goalInput=document.getElementById("goal");

function updateBar(){
if(goal>0){bar.style.width=(studied/(goal*60))*100+"%";}
}

// MOOD
function setMood(m){
let msg="";
if(m=="😓") msg="💙 Tension mat lo";
if(m=="😴") msg="😴 Rest lo";
if(m=="🙂") msg="🔥 Focus!";
addMsg(msg,"bot");
}

// CHAT
let userClass="";
classSelect.onchange=function(){
userClass=this.value;
addMsg("Class set: "+userClass,"bot");
};

function sendMessage(){
let msg=userInput.value.toLowerCase();
if(!msg)return;

addMsg(msg,"user");
userInput.value="";

let reply="🙂 Samajh raha hoon...";
if(msg.includes("stress")) reply="💙 Relax";
if(msg.includes("focus")) reply="📵 Phone door";
if(msg.includes("backlog")) reply="📚 Start small";

setTimeout(()=>addMsg(reply,"bot"),500);
}

function addMsg(text,type){
let d=document.createElement("div");
d.className=type;
d.innerText=text;
chatBox.appendChild(d);
chatBox.scrollTop=chatBox.scrollHeight;
}

// QUIZ
let answers=[];

function generateQuiz(){
let cls=document.getElementById("classSelect").value;
let qBox=document.getElementById("quizBox");
qBox.innerHTML="";
answers=[];

let questions=[];

if(cls=="1-5"){
questions=[
{q:"2+3?",o:["4","5","6"],a:"5"},
{q:"A for?",o:["Apple","Ball","Cat"],a:"Apple"}
];
}
else if(cls=="6-8"){
questions=[
{q:"12x2?",o:["24","22","20"],a:"24"},
{q:"H2O?",o:["Water","Air","Fire"],a:"Water"}
];
}
else if(cls=="9-10"){
questions=[
{q:"F=?",o:["ma","mc2","v"],a:"ma"},
{q:"(a+b)^2?",o:["a2+b2","a2+2ab+b2","ab"],a:"a2+2ab+b2"}
];
}
else if(cls=="11-12"){
questions=[
{q:"d/dx x^2?",o:["2x","x","x2"],a:"2x"},
{q:"V=?",o:["IR","ma","mc2"],a:"IR"}
];
}
else{
alert("Select class");
return;
}

questions.forEach((q,i)=>{
answers.push(q.a);
qBox.innerHTML+=`<p>${q.q}</p>`+
q.o.map(o=>`<label><input type="radio" name="q${i}" value="${o}">${o}</label>`).join("<br>");
});
}

function checkQuiz(){
let score=0;
answers.forEach((a,i)=>{
let ans=document.querySelector(`input[name=q${i}]:checked`);
if(ans && ans.value==a) score++;
});
quizResult.innerText="Score: "+score+"/"+answers.length;
}

// AUTO LOGIN
if(localStorage.getItem("userName")) showApp();

updateDisplay();
</script>

</body>
  </html>
